<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tvis</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand"><span class="mark"><i></i><i></i><i></i></span>tvis</div>
      <label class="run-picker" title="Recorded run"><select id="run-select"></select></label>
      <nav class="nav" id="nav" aria-label="Pages"></nav>
      <div class="spacer"></div>
      <div class="tools">
        <button class="icon-btn text notices-btn hidden" id="notices-btn"></button>
        <button class="icon-btn" id="help-btn" title="Keyboard shortcuts (?)"></button>
        <button class="icon-btn" id="theme-btn" title="Light / dark"></button>
      </div>
    </header>
    <div class="subnav" id="subnav"></div>
    <div id="explore" class="explore hidden">
      <div class="explore-bar">
        <div class="seg" id="mode-seg">
          <button data-mode="batch" class="on" title="One batch: its calls, samples, timeline">Batch</button>
          <button data-mode="step" title="One optimizer step: its batches and parameter updates">Step</button>
        </div>
        <div class="chips" id="index-chips"></div>
        <div id="follow-slot"></div>
        <div class="phasebar" id="phasebar"></div>
      </div>
      <main>
        <section class="panel" id="left">
          <div class="panel-head">
            <h2 id="left-title">Calls</h2>
            <input class="search" id="tree-search" placeholder="Filter  /" spellcheck="false">
            <button class="icon-btn" id="hidden-btn" title="Hidden calls"></button>
          </div>
          <div class="kind-filters" id="kind-filters"></div>
          <div class="panel-body"><div class="tree" id="tree"></div></div>
        </section>
        <section class="panel" id="center">
          <div class="panel-head"><div class="tabs" id="tabs"></div></div>
          <div class="panel-body" id="center-body"></div>
        </section>
        <section class="panel" id="right">
          <div class="panel-head"><div class="insp-title" id="insp-title"><h2>Inspector</h2></div></div>
          <div class="panel-body" id="inspector"></div>
        </section>
      </main>
    </div>
    <div id="page" class="page"></div>
  </div>
  <div class="tooltip hidden" id="tooltip"></div>
  <script type="importmap">{ "imports": { "three": "/static/vendor/three.module.min.js" } }</script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
